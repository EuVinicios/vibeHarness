site_name: VibeHarness
site_description: O harness de produção para desenvolvimento assistido por IA (vibecoding) — PRD, spec, stack curada, contexto sanitizado e auditoria em um único CLI.
site_url: https://euvinicios.github.io/vibeHarness/
repo_url: https://github.com/EuVinicios/vibeHarness
repo_name: EuVinicios/vibeHarness
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Início: index.md
  - O que fazemos por você: o-que-fazemos.md
  - Instalação: instalacao.md
  - Usando com a sua IA (MCP): usando-com-sua-ia.md
  - Guia por estágio: guia-por-estagio.md
  - Comandos:
      - status: comandos/status.md
      - install: comandos/install.md
      - prd: comandos/prd.md
      - init: comandos/init.md
      - plan (--apply): comandos/plan.md
      - pack: comandos/pack.md
      - audit: comandos/audit.md
      - doctor: comandos/doctor.md
      - start (deprecado): comandos/start.md
  - Ferramentas validadas: ferramentas-validadas.md
  - Segurança & LGPD: seguranca.md
