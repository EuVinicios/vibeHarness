name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly — Sundays at 04:00 UTC
    - cron: '0 4 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: 📊 CodeQL Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # actions/checkout@v4.4.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        # github/codeql-action/init@v3.37.7
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        # github/codeql-action/analyze@v3.37.7
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324
        with:
          category: '/language:javascript-typescript'
