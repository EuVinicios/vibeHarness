name: VibeHarness Gate

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  vibe-audit:
    name: 🛡️ VibeHarness Production Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout@v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        # actions/setup-node@v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build VibeHarness CLI
        run: npm run build

      - name: Run VibeHarness Audit
        id: audit
        # Run the freshly built local CLI directly. Avoid `npx vibe-harness`
        # here: the npm name is taken by a placeholder package, so npx is
        # ambiguous in this repo. In a consumer project, use `npx @vibeharness/cli`.
        run: |
          node dist/cli.js audit --report --fail-under 80
        env:
          NODE_ENV: ci

      - name: Upload Audit Report
        if: always()
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-report
          path: AUDIT_REPORT.md
          if-no-files-found: ignore

      - name: Post Audit Summary to PR
        if: github.event_name == 'pull_request' && always()
        # actions/github-script@v7.1.0
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'AUDIT_REPORT.md';
            if (!fs.existsSync(reportPath)) {
              console.log('No audit report found, skipping PR comment.');
              return;
            }
            const report = fs.readFileSync(reportPath, 'utf8');
            const truncated = report.length > 60000
              ? report.slice(0, 60000) + '\n\n_[Report truncated — see artifact for full details]_'
              : report;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('# VibeHarness Audit Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: truncated,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: truncated,
              });
            }
