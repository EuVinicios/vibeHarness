name: VibeHarness Gate

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  vibe-audit:
    name: 🛡️ VibeHarness Production Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build VibeHarness CLI
        run: npm run build

      - name: Run VibeHarness Audit
        id: audit
        run: |
          npx vibe-harness audit --report --fail-under 70
        env:
          NODE_ENV: ci

      - name: Upload Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: AUDIT_REPORT.md
          if-no-files-found: ignore

      - name: Post Audit Summary to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'AUDIT_REPORT.md';
            if (!fs.existsSync(reportPath)) {
              console.log('No audit report found, skipping PR comment.');
              return;
            }
            const report = fs.readFileSync(reportPath, 'utf8');
            const truncated = report.length > 60000
              ? report.slice(0, 60000) + '\n\n_[Report truncated — see artifact for full details]_'
              : report;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('# VibeHarness Audit Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: truncated,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: truncated,
              });
            }
