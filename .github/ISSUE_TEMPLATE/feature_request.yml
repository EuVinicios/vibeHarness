name: Feature request
description: Suggest a new feature or improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve for vibecoders?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you'd like it to work (command, flag, output...).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - init / spec generation
        - pack / context packaging
        - audit / scanners
        - prd / plan / stack recommendation
        - doctor / dependency maintenance
        - registry / curated catalog
        - CI & workflows
        - Documentation
    validations:
      required: true
