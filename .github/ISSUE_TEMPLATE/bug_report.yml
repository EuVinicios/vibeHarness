name: Bug report
description: Report a bug in the vibe-harness CLI
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! For security vulnerabilities, do NOT open an issue — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact commands and context needed to reproduce.
      placeholder: |
        1. npx vibe-harness init --yes
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Run `node -v` and `npx vibe-harness --version`.
      placeholder: |
        - vibe-harness version: 0.2.0
        - Node.js version: 20.x
        - OS: macOS / Linux / Windows
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any error output. Do NOT include secrets or API keys.
      render: shell
